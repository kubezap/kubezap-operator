name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: |
          go mod tidy
          make test

  generated-files:
    name: Generated Files Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate code, CRDs, RBAC, and webhook manifests
        run: |
          make generate
          make manifests

      - name: Fail if regeneration produced any diff
        run: |
          git diff --exit-code -- api/ config/ charts/kubezap-operator/crds/ || {
            echo "::error::Generated files are out of date. Run 'make generate && make manifests' locally and commit the result.";
            git diff --stat -- api/ config/ charts/kubezap-operator/crds/;
            exit 1;
          }

  bundle-drift:
    name: OLM Bundle Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate the OLM bundle
        run: |
          make bundle

      - name: Normalize non-deterministic CSV timestamp
        run: |
          # `operator-sdk generate bundle` stamps metadata.annotations.createdAt
          # in the CSV with the current wall-clock time on every single run, so
          # it always differs from the committed file even with zero real
          # drift. Reset it back to the committed value so only meaningful
          # content changes are flagged as drift below.
          csv=bundle/manifests/kubezap.clusterserviceversion.yaml
          if [ -f "$csv" ]; then
            orig_line="$(git show HEAD:"$csv" | grep -m1 '^\s*createdAt:' || true)"
            if [ -n "$orig_line" ]; then
              sed -i "s|^[[:space:]]*createdAt:.*|${orig_line}|" "$csv"
            fi
          fi

      - name: Fail if regeneration produced any diff
        run: |
          git diff --exit-code -- bundle/ || {
            echo "::error::bundle/ is out of date. Run 'make bundle' locally and commit the result.";
            git diff --stat -- bundle/;
            exit 1;
          }

  rbac-parity:
    name: RBAC Install Path Parity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Pinned for reproducibility, matching this repo's existing convention
      # in .github/workflows/release.yml — ubuntu-latest ships a recent Helm
      # already, but pinning avoids drift if the runner image's version moves.
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.17.0"

      - name: Regenerate RBAC manifests
        run: |
          make generate
          make manifests

      # No install step for yq: ubuntu-latest ships mikefarah/yq v4 already
      # (v4.53.6 as of the actions/runner-images Ubuntu 24.04 software
      # manifest), which is what hack/check-rbac-parity.sh requires.
      - name: Verify RBAC parity across generated / kustomize / Helm
        run: make verify-rbac-parity

  govulncheck:
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: make vulncheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build controller binary
        run: make build

      - name: Build CLI binary
        run: make build-cli

      - name: Build gateway binaries
        run: |
          go build -o bin/webhook-gateway ./cmd/webhook-gateway
          go build -o bin/kafka-gateway   ./cmd/kafka-gateway
          go build -o bin/amqp-gateway    ./cmd/amqp-gateway
          go build -o bin/nats-gateway    ./cmd/nats-gateway

      - name: Build http-executor binary
        run: go build -o bin/http-executor ./cmd/http-executor

  docker-build:
    name: Docker Build (validate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build controller image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: kubezap/controller:ci

      - name: Scan controller image (Trivy)
        id: trivy-controller
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kubezap/controller:ci
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Build webhook-gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cmd/webhook-gateway/Dockerfile
          push: false
          load: true
          tags: kubezap/webhook-gateway:ci

      - name: Scan webhook-gateway image (Trivy)
        id: trivy-webhook-gateway
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kubezap/webhook-gateway:ci
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Build kafka-gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cmd/kafka-gateway/Dockerfile
          push: false
          load: true
          tags: kubezap/kafka-gateway:ci

      - name: Scan kafka-gateway image (Trivy)
        id: trivy-kafka-gateway
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kubezap/kafka-gateway:ci
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Build amqp-gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cmd/amqp-gateway/Dockerfile
          push: false
          load: true
          tags: kubezap/amqp-gateway:ci

      - name: Scan amqp-gateway image (Trivy)
        id: trivy-amqp-gateway
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kubezap/amqp-gateway:ci
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Build nats-gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cmd/nats-gateway/Dockerfile
          push: false
          load: true
          tags: kubezap/nats-gateway:ci

      - name: Scan nats-gateway image (Trivy)
        id: trivy-nats-gateway
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kubezap/nats-gateway:ci
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Build http-executor image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cmd/http-executor/Dockerfile
          push: false
          load: true
          tags: kubezap/http-executor:ci

      - name: Scan http-executor image (Trivy)
        id: trivy-http-executor
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kubezap/http-executor:ci
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Fail job if any image scan found CRITICAL/HIGH findings
        if: always()
        run: |
          failed=0
          for outcome in \
            "controller:${{ steps.trivy-controller.outcome }}" \
            "webhook-gateway:${{ steps.trivy-webhook-gateway.outcome }}" \
            "kafka-gateway:${{ steps.trivy-kafka-gateway.outcome }}" \
            "amqp-gateway:${{ steps.trivy-amqp-gateway.outcome }}" \
            "nats-gateway:${{ steps.trivy-nats-gateway.outcome }}" \
            "http-executor:${{ steps.trivy-http-executor.outcome }}"; do
            name="${outcome%%:*}"
            result="${outcome##*:}"
            if [ "$result" = "failure" ]; then
              echo "::error::Trivy found CRITICAL/HIGH vulnerabilities in the $name image."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more images failed the Trivy CRITICAL/HIGH scan. See the corresponding 'Scan <image> image (Trivy)' step's log above for the finding details."
            exit 1
          fi
