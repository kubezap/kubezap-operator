name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # GitHub's own default recommendation for CodeQL: a weekly scan so newly
    # disclosed query-rule matches are caught even on otherwise-unchanged code.
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go"
