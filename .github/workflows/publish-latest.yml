name: Publish latest images

on:
  push:
    branches: ["main"]

permissions:
  packages: write

jobs:
  publish:
    name: Build and push :latest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: controller
            dockerfile: Dockerfile
          - name: webhook-gateway
            dockerfile: cmd/webhook-gateway/Dockerfile
          - name: kafka-gateway
            dockerfile: cmd/kafka-gateway/Dockerfile
          - name: amqp-gateway
            dockerfile: cmd/amqp-gateway/Dockerfile
          - name: nats-gateway
            dockerfile: cmd/nats-gateway/Dockerfile
          - name: http-executor
            dockerfile: cmd/http-executor/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}:latest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/kubezap/${{ matrix.name }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
