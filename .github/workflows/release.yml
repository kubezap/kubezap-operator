name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # create GitHub Release
  packages: write   # push to GHCR

jobs:
  release-cli:
    name: Release CLI binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # GoReleaser needs full history for changelog

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-images:
    name: Build and push container images
    runs-on: ubuntu-latest
    permissions:
      contents: read     # actions/checkout
      packages: write    # push image + cosign signature to GHCR
      id-token: write    # mint the OIDC token cosign uses for keyless signing
    strategy:
      matrix:
        include:
          - name: controller
            dockerfile: Dockerfile
          - name: webhook-gateway
            dockerfile: cmd/webhook-gateway/Dockerfile
          - name: kafka-gateway
            dockerfile: cmd/kafka-gateway/Dockerfile
          - name: amqp-gateway
            dockerfile: cmd/amqp-gateway/Dockerfile
          - name: nats-gateway
            dockerfile: cmd/nats-gateway/Dockerfile
          - name: http-executor
            dockerfile: cmd/http-executor/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/kubezap/${{ matrix.name }}
          # flavor: latest=auto only applies the `latest` tag when this tag is
          # the highest *stable* semver seen — never for a `-rc.N` prerelease
          # tag, so an RC never displaces the real `:latest`. The
          # {{major}}.{{minor}} pattern is likewise skipped by docker/metadata-action
          # for prerelease tags automatically (no explicit handling needed here).
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing via Sigstore's public-good Fulcio + Rekor, tied to
      # this workflow's own GitHub Actions OIDC identity (no stored signing
      # key or secret). Signs by digest — not tag — so the signature is
      # bound to the exact content pushed above, for both -rc.N and final
      # tags alike (no conditional skip). A signing failure fails this job:
      # an unsigned image published without any visible signal defeats the
      # point of signing at all.
      - name: Sign ${{ matrix.name }} image (cosign keyless)
        run: |
          cosign sign --yes \
            "ghcr.io/kubezap/${{ matrix.name }}@${{ steps.build.outputs.digest }}"

  release-helm:
    name: Publish Helm chart to GHCR OCI
    runs-on: ubuntu-latest
    needs: release-cli   # ensures the GitHub Release exists before chart publish
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.17.0"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package and push Helm chart
        run: |
          helm package charts/kubezap-operator --version ${{ steps.version.outputs.version }} \
            --app-version ${{ steps.version.outputs.version }}
          helm push kubezap-operator-${{ steps.version.outputs.version }}.tgz \
            oci://ghcr.io/kubezap/charts
