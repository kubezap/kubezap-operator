version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    errcheck:
      # These are all deferred resource-cleanup or best-effort CLI/test output calls
      # where the error is not actionable (nothing meaningful to do with a failed
      # HTTP body Close, a stdout/stderr write, or a temp-file removal in test
      # cleanup) and there is no established convention elsewhere in this repo of
      # checking them. Real handling errors (a genuine I/O write whose failure must
      # propagate) are checked normally — this exclude list is deliberately narrow.
      exclude-functions:
        - (io.Closer).Close
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # Test files -- HTTP methods, header names, fixture data repeat across cases with
      # no type-safety concern; per-line goconst suppression just shifts which
      # occurrence gets reported, so a path-scoped exclusion is used instead.
      - linters:
          - goconst
        path: _test\.go
      - linters:
          - goconst
        path: test/e2e/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
