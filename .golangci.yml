version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    errcheck:
      # These are all deferred resource-cleanup or best-effort CLI/test output calls
      # where the error is not actionable (nothing meaningful to do with a failed
      # HTTP body Close, a stdout/stderr write, or a temp-file removal in test
      # cleanup) and there is no established convention elsewhere in this repo of
      # checking them. Real handling errors (a genuine I/O write whose failure must
      # propagate) are checked normally — this exclude list is deliberately narrow.
      exclude-functions:
        - (io.Closer).Close
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # golangci-lint v2.1.0 -> v2.13.2 bump (2026-09-12, forced by a dependabot go.mod
      # bump to go 1.26.0, which v2.1.0 can't lint against) surfaced 176 new goconst
      # findings across the repo that the old version never reported -- same code, 0
      # issues before the bump, so this is a linter-sensitivity/default change, not a
      # code regression. Excluded here rather than fixed line-by-line: this repo's own
      # prior goconst cleanup (docs/design/2026-09-11-typed-phase-enums.md) already
      # established that per-line suppression of high-count strings just shifts which
      # occurrence is reported (whack-a-mole), so a path-scoped exclusion is the only
      # fix that converges.
      #
      # Permanent: test files (117 of 176) -- HTTP methods, header names, fixture data,
      # no type-safety concern, same reasoning as the dupl/lll test exclusion above.
      - linters:
          - goconst
        path: _test\.go
      - linters:
          - goconst
        path: test/e2e/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
