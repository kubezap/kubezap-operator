version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    errcheck:
      # These are all deferred resource-cleanup or best-effort CLI/test output calls
      # where the error is not actionable (nothing meaningful to do with a failed
      # HTTP body Close, a stdout/stderr write, or a temp-file removal in test
      # cleanup) and there is no established convention elsewhere in this repo of
      # checking them. Real handling errors (a genuine I/O write whose failure must
      # propagate) are checked normally — this exclude list is deliberately narrow.
      exclude-functions:
        - (io.Closer).Close
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # FlowRunStatus.Phase/StepRunStatus.Phase/FailurePolicy string literals
      # ("Running", "Succeeded", "Pending", "Continue", etc.) repeat 10-70+ times
      # each across these two files. Deduplicating the whole family into named
      # constants is a real refactor of live reconciliation logic (a 100+
      # call-site rename with no compiler safety net, since these are untyped
      # strings), not a lint fix -- deferred pending an owner decision on
      # whether to introduce a typed Phase enum instead. See docs/schedule.md §36.
      - linters:
          - goconst
        path: internal/controller/flowrun_controller(_test)?\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
