apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "automation.kubezap.io/v1alpha1",
          "kind": "Flow",
          "metadata": {
            "name": "handle-order"
          },
          "spec": {
            "params": [
              {
                "description": "Order identifier",
                "name": "orderId",
                "required": true
              }
            ],
            "steps": [
              {
                "action": {
                  "http": {
                    "method": "GET",
                    "resultMappings": {
                      "customerName": "$.customerName",
                      "id": "$.id"
                    },
                    "timeoutSeconds": 30,
                    "url": "https://orders.internal/api/orders/$(params.orderId)"
                  },
                  "type": "http"
                },
                "name": "enrich-order"
              },
              {
                "action": {
                  "http": {
                    "body": "{\"text\": \"Order $(steps.enrich_order.results.customerName) processed\"}",
                    "headers": {
                      "Content-Type": "application/json"
                    },
                    "method": "POST",
                    "url": "https://hooks.slack.com/services/REPLACE_ME"
                  },
                  "type": "http"
                },
                "name": "notify-slack",
                "runAfter": [
                  "enrich-order"
                ],
                "when": [
                  {
                    "expression": "steps.enrich_order.status == \"Succeeded\""
                  }
                ]
              }
            ]
          }
        },
        {
          "apiVersion": "automation.kubezap.io/v1alpha1",
          "kind": "FlowRun",
          "metadata": {
            "name": "handle-order-manual-test"
          },
          "spec": {
            "flowRef": {
              "name": "handle-order"
            },
            "params": [
              {
                "name": "orderId",
                "value": "12345"
              }
            ],
            "triggerRef": {
              "name": "order-received",
              "type": "webhook"
            },
            "ttlAfterFinished": "24h"
          }
        },
        {
          "apiVersion": "automation.kubezap.io/v1alpha1",
          "kind": "Integration",
          "metadata": {
            "name": "kafka-cluster"
          },
          "spec": {
            "kafka": {
              "bootstrapServers": [
                "kafka.default.svc.cluster.local:9092"
              ],
              "sasl": {
                "mechanism": "PLAIN",
                "passwordSecretRef": {
                  "key": "password",
                  "name": "kafka-credentials"
                },
                "usernameSecretRef": {
                  "key": "username",
                  "name": "kafka-credentials"
                }
              }
            },
            "type": "kafka"
          }
        },
        {
          "apiVersion": "automation.kubezap.io/v1alpha1",
          "kind": "MockEndpoint",
          "metadata": {
            "name": "mock-slack"
          },
          "spec": {
            "maxRequestHistory": 10,
            "path": "slack",
            "response": {
              "body": "{\"ok\":true}",
              "statusCode": 200
            }
          }
        },
        {
          "apiVersion": "automation.kubezap.io/v1alpha1",
          "kind": "Trigger",
          "metadata": {
            "name": "example-trigger"
          },
          "spec": {
            "flowRef": {
              "name": "example-flow"
            },
            "type": "webhook",
            "webhook": {
              "path": "/hooks/example"
            }
          }
        }
      ]
    capabilities: Basic Install
    categories: Integration & Delivery
    containerImage: docker.io/kubezap/controller:latest
    createdAt: "2026-03-20T20:16:39Z"
    description: Declarative workflow automation for Kubernetes — Zapier meets Camunda,
      but Kubernetes-native.
    operatorframework.io/suggested-namespace: kubezap-system
    operators.operatorframework.io/builder: operator-sdk-v1.42.0
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
    repository: https://github.com/borfswitch/kubezap
    support: KubeZap Community
  name: kubezap.v0.0.1
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: FlowRun is an execution instance of a Flow, created by a gateway
        when a trigger fires.
      displayName: FlowRun
      kind: FlowRun
      name: flowruns.automation.kubezap.io
      version: v1alpha1
    - description: Flow defines an ordered workflow of steps with conditional logic
        and data transforms.
      displayName: Flow
      kind: Flow
      name: flows.automation.kubezap.io
      version: v1alpha1
    - description: Integration connects KubeZap to an external system (Kafka, plugin,
        etc.).
      displayName: Integration
      kind: Integration
      name: integrations.automation.kubezap.io
      version: v1alpha1
    - description: MockEndpoint provides a dev/test HTTP mock server; captures requests
        in CRD status.
      displayName: MockEndpoint
      kind: MockEndpoint
      name: mockendpoints.automation.kubezap.io
      version: v1alpha1
    - description: Trigger is the Schema for the triggers API.
      displayName: Trigger
      kind: Trigger
      name: triggers.automation.kubezap.io
      version: v1alpha1
  description: |
    KubeZap is an enterprise-grade Kubernetes operator providing declarative
    workflow automation inspired by Zapier. Users define automations via CRDs
    instead of a web UI — think "Zapier meets Camunda, but Kubernetes-native."

    ## Features

    - **Webhook triggers**: Expose HTTP endpoints that fire workflows on incoming
      requests with HMAC, bearer token, OIDC/JWT, API-key, mTLS, and IP-allowlist
      authentication.
    - **Cron triggers**: Schedule workflow executions using standard cron expressions.
    - **Kafka triggers**: Consume from Kafka topics and create a FlowRun per message
      with partition/offset dedup keys.
    - **CEL conditions**: Per-step `when` expressions with full access to trigger
      payload and upstream step results.
    - **Data transforms**: `type: transform` steps for payload shaping between steps.
    - **Retry policies**: Configurable per-step exponential backoff.
    - **Plugin integrations**: Operator-managed plugin Deployments with automatic
      RBAC and secret injection.
    - **MockEndpoint**: Zero-dependency HTTP mock server for CI/test workflows.
    - **Observability**: Prometheus metrics, OpenTelemetry traces, and structured JSON
      access logs out of the box.

    ## Multi-namespace support

    Set `WATCH_NAMESPACES` on the operator Deployment:
    - Empty (default) — AllNamespaces
    - Single value — OwnNamespace / SingleNamespace
    - Comma-separated — MultiNamespace
