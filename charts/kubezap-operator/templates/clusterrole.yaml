{{- if not (include "kubezap.namespacedRBAC" .) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubezap.fullname" . }}
  labels:
    {{- include "kubezap.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - namespaces
    verbs:
      - get
      - list
      - watch
  # AllNamespaces mode: full CRUD is required cluster-wide — read access to resolve
  # secretRefs in Triggers/Integrations, and write access for the executor's own
  # mTLS cert Secret (reconcileExecutorCertSecret), which the executor needs in
  # whatever namespace it's deployed into. The actual security boundary for
  # *reading* a Secret in AllNamespaces mode is enforced in application code, not
  # RBAC — see docs/design/allnamespaces-secrets-label-restriction.md for why RBAC
  # itself cannot express a "namespace must carry a given label" restriction. To
  # scope secrets access down to the operator's own namespace via RBAC directly, use
  # watchOwnNamespace: true (the default) instead of AllNamespaces mode.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - automation.kubezap.io
    resources:
      - flowruns
      - triggers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - automation.kubezap.io
    resources:
      - flowruns/finalizers
      - triggers/finalizers
    verbs:
      - update
  - apiGroups:
      - automation.kubezap.io
    resources:
      - flowruns/status
      - flows/status
      - integrations/status
      - triggers/status
      - webhookgatewayconfigs/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - automation.kubezap.io
    resources:
      - flows
      - integrations
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - automation.kubezap.io
    resources:
      - webhookgatewayconfigs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - keda.sh
    resources:
      - scaledobjects
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
      - roles
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
{{- end }}
