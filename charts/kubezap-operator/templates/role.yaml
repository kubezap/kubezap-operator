{{- $root := . -}}
{{- range (include "kubezap.watchNamespaceList" . | fromJsonArray) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubezap.fullname" $root }}
  namespace: {{ . }}
  labels:
    {{- include "kubezap.labels" $root | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  - apiGroups:
      - automation.kubezap.io
    resources:
      - flowruns
      - triggers
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  - apiGroups:
      - automation.kubezap.io
    resources:
      - flowruns/finalizers
      - triggers/finalizers
    verbs:
      - update
  - apiGroups:
      - automation.kubezap.io
    resources:
      - flowruns/status
      - flows/status
      - integrations/status
      - webhookgatewayconfigs/status
    verbs:
      - get
      - update
  - apiGroups:
      - automation.kubezap.io
    resources:
      - triggers/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - automation.kubezap.io
    resources:
      - flows
      - integrations
    verbs:
      - get
      - list
      - update
      - watch
  - apiGroups:
      - automation.kubezap.io
    resources:
      - webhookgatewayconfigs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  - apiGroups:
      - keda.sh
    resources:
      - scaledobjects
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
      - roles
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubezap.fullname" $root }}
  namespace: {{ . }}
  labels:
    {{- include "kubezap.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubezap.fullname" $root }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubezap.serviceAccountName" $root }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
