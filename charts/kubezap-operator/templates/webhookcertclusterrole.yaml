# ValidatingWebhookConfiguration is cluster-scoped, so this permission can
# never be granted via the namespaced Role(s) in role.yaml — every watch mode
# (OwnNamespace, SingleNamespace, MultiNamespace) now uses namespace-scoped
# Roles only, and none of them can express a cluster-scoped grant. This
# ClusterRole + ClusterRoleBinding pair is rendered unconditionally, regardless
# of watch mode, so the operator's self-managed webhook cert mechanism
# (internal/webhookcerts) can always patch the ValidatingWebhookConfiguration's
# caBundle. See docs/design/self-managed-webhook-certs.md and
# docs/design/namespace-scoped-watch-modes-only.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubezap.fullname" . }}-webhook-cert
  labels:
    {{- include "kubezap.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingwebhookconfigurations
    verbs:
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubezap.fullname" . }}-webhook-cert
  labels:
    {{- include "kubezap.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubezap.fullname" . }}-webhook-cert
subjects:
  - kind: ServiceAccount
    name: {{ include "kubezap.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
