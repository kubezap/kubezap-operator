# Number of controller replicas (2-3 recommended for HA)
replicaCount: 1

# Controller image
image:
  repository: ghcr.io/kubezap/controller
  tag: "latest"
  pullPolicy: IfNotPresent

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Installation scope. Controls which namespaces the operator watches and what RBAC is created.
# Every watch mode below gets a namespace-scoped Role — the operator never requires a
# ClusterRole for its own reconciler permissions (see
# docs/design/namespace-scoped-watch-modes-only.md).
#
# watchOwnNamespace: true  (default — most secure)
#   Operator watches only its own release namespace. One Role + RoleBinding, scoped to
#   that namespace. Recommended for production.
#
# watchOwnNamespace: false
#   Operator watches the explicit namespace(s) listed in watchNamespaces instead of its
#   own release namespace. One Role + RoleBinding is templated per listed namespace —
#   still no ClusterRole, regardless of how many namespaces are listed.
#
watchOwnNamespace: true

# Explicit namespace list (only used when watchOwnNamespace is false).
# "ns"         → SingleNamespace (one Role + RoleBinding, scoped to that namespace)
# "ns1,ns2"    → MultiNamespace (one Role + RoleBinding pair PER listed namespace)
watchNamespaces: ""

# Leader election
leaderElect: true

# Health probe bind address
healthProbeBindAddress: ":8081"

# Gateway images (injected into controller env vars; controller spawns these as Deployments)
gatewayImages:
  webhook: "ghcr.io/kubezap/webhook-gateway:latest"
  kafka: "ghcr.io/kubezap/kafka-gateway:latest"
  amqp: "ghcr.io/kubezap/amqp-gateway:latest"
  nats: "ghcr.io/kubezap/nats-gateway:latest"

# Pod security context (applied to pod spec)
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Resource requests and limits
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity (for multi-arch or HA scheduling)
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/arch
              operator: In
              values:
                - amd64
                - arm64
                - ppc64le
                - s390x
            - key: kubernetes.io/os
              operator: In
              values:
                - linux

# HTTP executor — one Deployment per managed namespace.
# The controller reconciler creates and manages these from the image and port below.
executor:
  image: ghcr.io/kubezap/http-executor:latest
  port: 8091
  # mTLS between the controller and each executor Deployment (see
  # docs/design/security-architecture.md's "Controller-to-executor channel
  # security"). Opt-in: a NetworkPolicy already restricts executor ingress to
  # controller pods regardless of this setting; enable mTLS only if your
  # cluster has no service mesh already providing it (Istio/Linkerd make this
  # redundant). When true, the controller generates a self-signed CA at
  # startup, issues a server cert for the executor and a client cert for
  # itself, and rotates them automatically.
  mtls: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Additional pod annotations
podAnnotations: {}

# Termination grace period
terminationGracePeriodSeconds: 10
