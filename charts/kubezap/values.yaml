# Number of controller replicas (2-3 recommended for HA)
replicaCount: 1

# Controller image
image:
  repository: ghcr.io/kubezap/controller
  tag: "latest"
  pullPolicy: IfNotPresent

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Watch namespace(s).
# ""           → AllNamespaces (ClusterRole + ClusterRoleBinding)
# "ns"         → SingleNamespace / OwnNamespace (Role + RoleBinding scoped to release namespace)
# "ns1,ns2"    → MultiNamespace (ClusterRole + ClusterRoleBinding, controller env WATCH_NAMESPACES set)
watchNamespaces: ""

# Leader election
leaderElect: true

# Health probe bind address
healthProbeBindAddress: ":8081"

# Gateway images (injected into controller env vars; controller spawns these as Deployments)
gatewayImages:
  webhook: "ghcr.io/kubezap/webhook-gateway:latest"
  kafka: "ghcr.io/kubezap/kafka-gateway:latest"
  amqp: "ghcr.io/kubezap/amqp-gateway:latest"
  nats: "ghcr.io/kubezap/nats-gateway:latest"

# Pod security context (applied to pod spec)
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Resource requests and limits
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity (for multi-arch or HA scheduling)
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/arch
              operator: In
              values:
                - amd64
                - arm64
                - ppc64le
                - s390x
            - key: kubernetes.io/os
              operator: In
              values:
                - linux

# Additional pod annotations
podAnnotations: {}

# Termination grace period
terminationGracePeriodSeconds: 10
