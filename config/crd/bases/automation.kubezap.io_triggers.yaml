---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: triggers.automation.kubezap.io
spec:
  group: automation.kubezap.io
  names:
    kind: Trigger
    listKind: TriggerList
    plural: triggers
    singular: trigger
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Trigger is the Schema for the triggers API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TriggerSpec defines the desired state of Trigger.
            properties:
              action:
                description: Inline action definition (optional). Starts with webhook
                  action type.
                properties:
                  type:
                    description: Type of action (webhook)
                    enum:
                    - webhook
                    type: string
                  webhook:
                    description: Webhook action details
                    properties:
                      body:
                        description: Optional body template (raw string or templating
                          placeholder)
                        type: string
                      headers:
                        additionalProperties:
                          type: string
                        description: Optional headers to include in the call
                        type: object
                      method:
                        default: POST
                        description: HTTP method to use (default POST)
                        enum:
                        - POST
                        - PUT
                        - PATCH
                        - GET
                        type: string
                      url:
                        description: URL to call when the trigger fires
                        type: string
                    required:
                    - url
                    type: object
                required:
                - type
                type: object
              cooldown:
                description: Cooldown/debounce policy to limit the number of firings
                  in a window.
                properties:
                  maxInvocations:
                    description: MaxInvocations allowed within Window. If zero, no
                      limit is applied.
                    format: int32
                    type: integer
                  window:
                    default: 60s
                    description: Window for counting invocations, e.g. "60s". If omitted,
                      defaults to 60s.
                    type: string
                type: object
              enabled:
                default: true
                description: Whether this trigger is active
                type: boolean
              event:
                description: |-
                  Event or condition type for resource triggers (create/update/delete).
                  For external triggers (webhook/cron/pubsub) this is typically empty.
                type: string
              flowRef:
                description: |-
                  Reference to the flow this trigger invokes. FlowRef is the primary
                  action target for the MVP. If omitted, the optional inline Action can
                  be used to perform a quick action (e.g., call an external webhook).
                properties:
                  name:
                    description: Name of the Flow CR to execute
                    type: string
                  namespace:
                    description: Namespace of the Flow CR. If omitted the Trigger's
                      namespace is used.
                    type: string
                required:
                - name
                type: object
              target:
                description: |-
                  Optional target resource in the cluster to watch or reference. Kept
                  optional for the MVP (external events only by default) but present
                  so future resource-based triggers can be added without schema changes.
                properties:
                  kind:
                    description: Kind of resource (Pod, ConfigMap, CustomKind)
                    type: string
                  labelSelector:
                    description: LabelSelector allows selecting resources by labels
                      instead of exact name.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  name:
                    description: Name of a specific resource to target.
                    type: string
                  namespace:
                    description: Namespace of the resource. If empty and Name is set,
                      it defaults to the Trigger's namespace.
                    type: string
                type: object
              type:
                description: Type of trigger (webhook, cron, pubsub)
                enum:
                - webhook
                - cron
                - pubsub
                type: string
              webhook:
                description: Webhook configuration (only for type=webhook)
                properties:
                  method:
                    default: POST
                    enum:
                    - POST
                    - PUT
                    type: string
                  path:
                    description: HTTP path exposed by the operator
                    type: string
                required:
                - path
                type: object
            required:
            - type
            type: object
          status:
            description: TriggerStatus defines the observed state of Trigger.
            properties:
              conditions:
                description: Standard Kubernetes conditions
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentInvocationCount:
                description: CurrentInvocationCount is the number of invocations in
                  the current cooldown window
                format: int32
                type: integer
              lastError:
                description: LastError contains a short error message from the last
                  failed attempt
                type: string
              lastResult:
                description: LastResult indicates the outcome of the last trigger
                  attempt (e.g., Success, Failed, Skipped, RateLimited)
                type: string
              lastTriggeredTime:
                description: LastTriggeredTime is the timestamp of the last successful
                  trigger firing
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
