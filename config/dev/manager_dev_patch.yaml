# Dev/test patch: enables in-cluster SSRF bypass and scopes the watch to the
# default namespace. NOT for production use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
        - name: manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --ssrf-allow-in-cluster=true
          env:
            - name: WATCH_NAMESPACES
              value: "default"
