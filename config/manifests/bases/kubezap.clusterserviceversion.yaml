    url: https://github.com/kubezap/kubezap-operator/docs
  - name: Source Code
    url: https://github.com/kubezap/kubezap-operator
  maintainers:
  - email: maintainers@kubezap.io
    name: KubeZap Maintainers
  maturity: alpha
  minKubeVersion: 1.25.0
  provider:
