---
# Normally fully regenerated by `make manifests` from +kubebuilder:rbac markers in
# internal/controller/. The `secrets` (create/update/patch/delete) and
# `networking.k8s.io/networkpolicies` rules below were added by hand on 2026-09-10:
# `make manifests` was not reflecting the markers already present in
# executor_reconciler.go (confirmed via canary marker + syntax-error tests — a real
# tooling/environment issue, not a marker syntax error). See docs/schedule.md §30.
# Once that's root-caused and fixed, re-run `make manifests` and this comment can go.
#
# WARNING: `make manifests`/`make generate`/`make test` (which depends on both) will
# silently revert this file back to the stale/broken state described above — the
# generator doesn't error, it just re-emits the same incomplete output. Re-apply this
# patch after running any of those targets, until §30 is root-caused.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - automation.kubezap.io
  resources:
  - flowruns
  - triggers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - automation.kubezap.io
  resources:
  - flowruns/finalizers
  - triggers/finalizers
  verbs:
  - update
- apiGroups:
  - automation.kubezap.io
  resources:
  - flowruns/status
  - flows/status
  - integrations/status
  - triggers/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - automation.kubezap.io
  resources:
  - flows
  - integrations
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
