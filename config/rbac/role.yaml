---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - automation.kubezap.io
  resources:
  - flowruns
  verbs:
  - create
- apiGroups:
  - automation.kubezap.io
  resources:
  - triggers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - automation.kubezap.io
  resources:
  - triggers/finalizers
  verbs:
  - update
- apiGroups:
  - automation.kubezap.io
  resources:
  - triggers/status
  verbs:
  - get
  - patch
  - update
