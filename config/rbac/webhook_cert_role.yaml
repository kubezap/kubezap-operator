---
# ValidatingWebhookConfiguration is cluster-scoped, so this permission can
# never be granted via a namespaced Role (see namespaced_role.yaml's header
# comment). This ClusterRole+ClusterRoleBinding pair is applied unconditionally,
# regardless of WATCH_NAMESPACES install mode, so the operator's self-managed
# webhook cert mechanism (internal/webhookcerts) can always patch the
# ValidatingWebhookConfiguration's caBundle. See
# docs/design/self-managed-webhook-certs.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubezap
    app.kubernetes.io/managed-by: kustomize
  name: webhook-cert-role
rules:
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingwebhookconfigurations
  verbs:
  - get
  - list
  - patch
  - update
  - watch
