apiVersion: automation.kubezap.io/v1alpha1
kind: Trigger
metadata:
  labels:
    app.kubernetes.io/name: kubezap
    app.kubernetes.io/managed-by: kustomize
  name: plugin-orders
  namespace: default
spec:
  type: plugin
  enabled: true
  plugin:
    # Must reference an Integration with spec.type: plugin in the same namespace.
    integrationRef:
      name: my-plugin
    # Opaque, plugin-defined settings; the operator never interprets these.
    config:
      queueUrl: https://sqs.us-east-1.amazonaws.com/123456789012/orders
  flowRef:
    name: process-order
