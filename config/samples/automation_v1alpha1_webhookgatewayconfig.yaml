# Example WebhookGatewayConfig — widens the default autoscaling range for a
# higher-traffic namespace and terminates TLS on the gateway's listener.
# At most one WebhookGatewayConfig may exist per namespace — the object must
# be named "default" (enforced by a CRD-level CEL validation rule); omit any
# field to keep the operator's default for it.
apiVersion: automation.kubezap.io/v1alpha1
kind: WebhookGatewayConfig
metadata:
  name: default
  namespace: default
spec:
  tls:
    serverSecretRef:
      name: webhook-gateway-tls
    clientCASecretRef:
      name: webhook-gateway-mtls-ca
  hpa:
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilization: 60
