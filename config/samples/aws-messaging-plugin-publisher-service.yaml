# Service the controller calls for `type: publish` steps through the
# aws-messaging Integration. The operator does not currently create a Service
# for type: plugin Integrations, but the controller dials
#   kubezap-plugin-<integration>.<namespace>.svc.cluster.local:<publisherPort>
# so the name, selector and port below must match exactly.
# See docs/plugins/aws-sqs-sns/README.md, step 4.
apiVersion: v1
kind: Service
metadata:
  name: kubezap-plugin-aws-messaging
  namespace: default
spec:
  selector:
    app: kubezap-plugin-aws-messaging
  ports:
    - name: publisher
      port: 8090
      targetPort: 8090
      protocol: TCP
