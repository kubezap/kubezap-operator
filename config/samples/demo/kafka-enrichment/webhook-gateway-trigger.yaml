# This trigger exists solely to ensure the webhook gateway Deployment is created
# in this namespace. The gateway is required to serve /mock/* endpoints used by
# the enrich-customer-event flow. It does not need to receive any actual requests.
apiVersion: automation.kubezap.io/v1alpha1
kind: Trigger
metadata:
  name: kafka-enrichment-gateway-init
  namespace: default
spec:
  type: webhook
  enabled: true
  webhook:
    path: /hooks/kafka-enrichment-init
    method: POST
  flowRef:
    name: enrich-customer-event
