---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-automation-kubezap-io-v1alpha1-flowrun
  failurePolicy: Ignore
  name: vflowrun.kb.io
  rules:
  - apiGroups:
    - automation.kubezap.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - flowruns
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-automation-kubezap-io-v1alpha1-trigger
  failurePolicy: Ignore
  name: vtrigger.kb.io
  rules:
  - apiGroups:
    - automation.kubezap.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - triggers
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-automation-kubezap-io-v1alpha1-webhookgatewayconfig
  failurePolicy: Fail
  name: vwebhookgatewayconfig.kb.io
  rules:
  - apiGroups:
    - automation.kubezap.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - webhookgatewayconfigs
  sideEffects: None
