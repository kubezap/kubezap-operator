apiVersion: automation.kubezap.io/v1alpha1
kind: Trigger
metadata:
  name: orders-dlq-trigger
  namespace: default
spec:
  type: kafka
  enabled: true
  kafka:
    integrationRef:
      name: orders-kafka
    topic: orders.dlq
    consumerGroup: kubezap-dlq-handler
  flowRef:
    name: handle-dlq-message
