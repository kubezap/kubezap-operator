apiVersion: automation.kubezap.io/v1alpha1
kind: Integration
metadata:
  name: github-api
  namespace: default
spec:
  type: http
  http:
    baseUrl: "https://api.github.com"
    auth:
      type: bearer
      bearer:
        tokenSecretRef:
          name: github-api-token
          key: token
    defaultHeaders:
      Content-Type: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
