# Placeholder Secret manifests — replace values before applying.
#
# Recommended: create via kubectl rather than applying this file directly,
# to avoid committing credentials to source control:
#
#   kubectl create secret generic github-webhook-secret \
#     --from-literal=secret='<your-github-webhook-secret>'
#
#   kubectl create secret generic github-api-token \
#     --from-literal=token='ghp_<your-github-personal-access-token>'
#
# Required token scopes: repo (for private repos) or public_repo (for public repos)
# The token only needs write access to pull request labels (issues: write).
---
apiVersion: v1
kind: Secret
metadata:
  name: github-webhook-secret
  namespace: default
type: Opaque
stringData:
  secret: "REPLACE-WITH-YOUR-GITHUB-WEBHOOK-SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: github-api-token
  namespace: default
type: Opaque
stringData:
  token: "REPLACE-WITH-YOUR-GITHUB-TOKEN"
