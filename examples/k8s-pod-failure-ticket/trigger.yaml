apiVersion: automation.kubezap.io/v1alpha1
kind: Trigger
metadata:
  name: pod-failure-trigger
  namespace: default
  annotations:
    kubezap.io/note: "Watches for Pod phase=Failed events"
spec:
  type: resource
  resource:
    apiVersion: v1
    kind: Pod
    namespace: default
    events: [update]
    watchFields:
      - ".status.phase"
  flowRef:
    name: open-itsm-ticket
