---
# Simulates the customer profile enrichment API.
# Returns a JSON body with customerId, tier, and region.
# The webhook gateway serves this at /mock/customer-profile.
apiVersion: automation.kubezap.io/v1alpha1
kind: MockEndpoint
metadata:
  name: customer-profile
  namespace: default
spec:
  path: /mock/customer-profile
  response:
    statusCode: 200
    headers:
      Content-Type: application/json
    body: |
      {
        "customerId": "{{.Body.customerId}}",
        "tier": "enterprise",
        "region": "us-east-1",
        "accountManager": "alice@example.com"
      }
---
# Sink for enterprise-tier notifications.
apiVersion: automation.kubezap.io/v1alpha1
kind: MockEndpoint
metadata:
  name: enterprise-sink
  namespace: default
spec:
  path: /mock/enterprise-sink
  response:
    statusCode: 202
    headers:
      Content-Type: application/json
    body: '{"accepted":true}'
---
# Sink for standard-tier notifications.
apiVersion: automation.kubezap.io/v1alpha1
kind: MockEndpoint
metadata:
  name: standard-sink
  namespace: default
spec:
  path: /mock/standard-sink
  response:
    statusCode: 202
    headers:
      Content-Type: application/json
    body: '{"accepted":true}'
---
# Sink for trial-tier nurture sequences.
apiVersion: automation.kubezap.io/v1alpha1
kind: MockEndpoint
metadata:
  name: trial-sink
  namespace: default
spec:
  path: /mock/trial-sink
  response:
    statusCode: 202
    headers:
      Content-Type: application/json
    body: '{"accepted":true}'
