---
# -----------------------------------------------------------------------------
# 2. Deployment
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockoon
  namespace: default
  labels:
    app: mockoon
    app.kubernetes.io/component: mock-server
    app.kubernetes.io/part-of: multi-tenant-fanout-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mockoon
  template:
    metadata:
      labels:
        app: mockoon
        app.kubernetes.io/component: mock-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mockoon
          image: mockoon/mockoon:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--data"
            - "/config/environment.json"
            - "--port"
            - "3000"
            - "--admin-api-port"
            - "3001"
          ports:
            - name: mock
              containerPort: 3000
              protocol: TCP
            - name: admin
              containerPort: 3001
              protocol: TCP
          volumeMounts:
            - name: mockoon-config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: mockoon-config
          configMap:
            name: mockoon-env
      restartPolicy: Always
---
# -----------------------------------------------------------------------------
# 3. Service
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: mockoon
  namespace: default
  labels:
    app: mockoon
    app.kubernetes.io/component: mock-server
    app.kubernetes.io/part-of: multi-tenant-fanout-example
spec:
  selector:
    app: mockoon
  ports:
    - name: mock
      port: 3000
      targetPort: mock
      protocol: TCP
    - name: admin
      port: 3001
      targetPort: admin
      protocol: TCP
  type: ClusterIP
