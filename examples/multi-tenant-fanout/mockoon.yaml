# Mockoon in-cluster mock server for the multi-tenant-fanout example.
#
# Provides three stub routes:
#   POST /events/a  -> 202 {"accepted":true,"tenant":"a"}
#   POST /events/b  -> 202 {"accepted":true,"tenant":"b"}
#   POST /events/c  -> 202 {"accepted":true,"tenant":"c"}
#
# Apply with the rest of the example:
#   kubectl apply -k examples/multi-tenant-fanout/
#
# Inspect captured requests:
#   kubectl exec -n default \
#     $(kubectl get pod -n default -l app=mockoon -o jsonpath='{.items[0].metadata.name}') \
#     -- wget -q -O - http://localhost:3001/api/logs | jq .
#
# See docs/guides/mocking-http-endpoints.md for the full Mockoon guide.
# -----------------------------------------------------------------------------
# 1. ConfigMap
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: mockoon-env
  namespace: default
  labels:
    app: mockoon
    app.kubernetes.io/component: mock-server
    app.kubernetes.io/part-of: multi-tenant-fanout-example
data:
  environment.json: |
    {
      "uuid": "mtf-env-uuid",
      "lastMigration": 32,
      "name": "multi-tenant-fanout mocks",
      "endpointPrefix": "",
      "latency": 0,
      "port": 3000,
      "hostname": "",
      "folders": [],
      "routes": [
        {
          "uuid": "mtf-r0001-events-a",
          "type": "http",
          "documentation": "Tenant A event sink — accepts forwarded events",
          "method": "post",
          "endpoint": "events/a",
          "responses": [
            {
              "uuid": "mtf-resp-events-a-202",
              "body": "{\"accepted\":true,\"tenant\":\"a\"}",
              "latency": 0,
              "statusCode": 202,
              "label": "Accepted (tenant A)",
              "headers": [
                { "key": "Content-Type", "value": "application/json" }
              ],
              "bodyType": "INLINE",
              "filePath": "",
              "databucketID": "",
              "sendFileAsBody": false,
              "rules": [],
              "rulesOperator": "OR",
              "disableTemplating": false,
              "fallbackTo404": false,
              "default": true,
              "crudKey": "id",
              "callbacks": []
            }
          ],
          "enabled": true,
          "responseMode": null,
          "streamingMode": null
        },
        {
          "uuid": "mtf-r0002-events-b",
          "type": "http",
          "documentation": "Tenant B event sink — accepts forwarded events",
          "method": "post",
          "endpoint": "events/b",
          "responses": [
            {
              "uuid": "mtf-resp-events-b-202",
              "body": "{\"accepted\":true,\"tenant\":\"b\"}",
              "latency": 0,
              "statusCode": 202,
              "label": "Accepted (tenant B)",
              "headers": [
                { "key": "Content-Type", "value": "application/json" }
              ],
              "bodyType": "INLINE",
              "filePath": "",
              "databucketID": "",
              "sendFileAsBody": false,
              "rules": [],
              "rulesOperator": "OR",
              "disableTemplating": false,
              "fallbackTo404": false,
              "default": true,
              "crudKey": "id",
              "callbacks": []
            }
          ],
          "enabled": true,
          "responseMode": null,
          "streamingMode": null
        },
        {
          "uuid": "mtf-r0003-events-c",
          "type": "http",
          "documentation": "Tenant C event sink — accepts forwarded events",
          "method": "post",
          "endpoint": "events/c",
          "responses": [
            {
              "uuid": "mtf-resp-events-c-202",
              "body": "{\"accepted\":true,\"tenant\":\"c\"}",
              "latency": 0,
              "statusCode": 202,
              "label": "Accepted (tenant C)",
              "headers": [
                { "key": "Content-Type", "value": "application/json" }
              ],
              "bodyType": "INLINE",
              "filePath": "",
              "databucketID": "",
              "sendFileAsBody": false,
              "rules": [],
              "rulesOperator": "OR",
              "disableTemplating": false,
              "fallbackTo404": false,
              "default": true,
              "crudKey": "id",
              "callbacks": []
            }
          ],
          "enabled": true,
          "responseMode": null,
          "streamingMode": null
        }
      ],
      "rootChildren": [
        { "type": "route", "uuid": "mtf-r0001-events-a" },
        { "type": "route", "uuid": "mtf-r0002-events-b" },
        { "type": "route", "uuid": "mtf-r0003-events-c" }
      ],
      "proxyMode": false,
      "proxyHost": "",
      "proxyRemovePrefix": false,
      "tlsOptions": {
        "enabled": false,
        "type": "CERT",
        "pfxPath": "",
        "certPath": "",
        "keyPath": "",
        "caPath": "",
        "passphrase": ""
