apiVersion: automation.kubezap.io/v1alpha1
kind: MockEndpoint
metadata:
  name: export-api
  namespace: default
spec:
  # Simulates a database export service.
  # In production, replace the export-data step URL with your real export API.
  path: /mock/export-api
  methods:
    - POST
  response:
    statusCode: 200
    headers:
      Content-Type: application/json
    body: >-
      {
        "exportId":  "export-20260320-001",
        "rowCount":  1250,
        "status":    "completed",
        "tables":    ["orders", "customers", "products"]
      }
