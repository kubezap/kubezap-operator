# Mockoon in-cluster mock server for the nightly-export example.
#
# Provides one stub route:
#   POST /export-api → 200 JSON with exportId, rowCount, status, tables
#
# Apply with the rest of the example:
#   kubectl apply -k examples/nightly-export/
#
# Inspect captured requests:
#   kubectl exec -n default \
#     $(kubectl get pod -n default -l app=mockoon -o jsonpath='{.items[0].metadata.name}') \
#     -- wget -q -O - http://localhost:3001/api/logs | jq .
#
# See docs/guides/mocking-http-endpoints.md for the full Mockoon guide.
# ─────────────────────────────────────────────────────────────────────────────
# 1. ConfigMap
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: mockoon-env
  namespace: default
  labels:
    app: mockoon
    app.kubernetes.io/component: mock-server
    app.kubernetes.io/part-of: nightly-export-example
data:
  environment.json: |
    {
      "uuid": "ne-env-uuid",
      "lastMigration": 32,
      "name": "nightly-export mocks",
      "endpointPrefix": "",
      "latency": 0,
      "port": 3000,
      "hostname": "",
      "folders": [],
      "routes": [
        {
          "uuid": "r0001-export-api",
          "type": "http",
          "documentation": "Simulates a database export service. Returns a fixed export result.",
          "method": "post",
          "endpoint": "export-api",
          "responses": [
            {
              "uuid": "resp-export-api-200",
              "body": "{\"exportId\":\"export-20260320-001\",\"rowCount\":1250,\"status\":\"completed\",\"tables\":[\"orders\",\"customers\",\"products\"]}",
              "latency": 0,
              "statusCode": 200,
              "label": "Success",
              "headers": [
                { "key": "Content-Type", "value": "application/json" }
              ],
              "bodyType": "INLINE",
              "filePath": "",
              "databucketID": "",
              "sendFileAsBody": false,
              "rules": [],
              "rulesOperator": "OR",
              "disableTemplating": false,
              "fallbackTo404": false,
              "default": true,
              "crudKey": "id",
              "callbacks": []
            }
          ],
          "enabled": true,
          "responseMode": null,
          "streamingMode": null
        },
        {
          "uuid": "r0002-slack-webhook",
          "type": "http",
          "documentation": "Simulates a Slack incoming webhook. Accepts POST and returns 200 OK.",
          "method": "post",
          "endpoint": "slack-webhook",
          "responses": [
            {
              "uuid": "resp-slack-webhook-200",
              "body": "ok",
              "latency": 0,
              "statusCode": 200,
              "label": "Success",
              "headers": [
                { "key": "Content-Type", "value": "text/plain" }
              ],
              "bodyType": "INLINE",
              "filePath": "",
              "databucketID": "",
              "sendFileAsBody": false,
              "rules": [],
              "rulesOperator": "OR",
              "disableTemplating": false,
              "fallbackTo404": false,
              "default": true,
              "crudKey": "id",
              "callbacks": []
            }
          ],
          "enabled": true,
          "responseMode": null,
          "streamingMode": null
        }
      ],
      "rootChildren": [
        { "type": "route", "uuid": "r0001-export-api" },
        { "type": "route", "uuid": "r0002-slack-webhook" }
      ],
      "proxyMode": false,
      "proxyHost": "",
      "proxyRemovePrefix": false,
      "tlsOptions": {
        "enabled": false,
        "type": "CERT",
        "pfxPath": "",
        "certPath": "",
        "keyPath": "",
        "caPath": "",
        "passphrase": ""
      },
      "cors": true,
      "headers": [
        { "key": "Content-Type", "value": "application/json" },
        { "key": "Access-Control-Allow-Origin", "value": "*" },
        { "key": "Access-Control-Allow-Methods", "value": "GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS" },
        { "key": "Access-Control-Allow-Headers", "value": "Content-Type, Origin, Accept, Authorization, Content-Length, X-Requested-With" }
      ],
      "proxyReqHeaders": [{ "key": "", "value": "" }],
      "proxyResHeaders": [{ "key": "", "value": "" }],
      "data": [],
      "callbacks": [],
      "initialDatabuckets": []
    }
---
# ─────────────────────────────────────────────────────────────────────────────
# 2. Deployment
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockoon
  namespace: default
  labels:
    app: mockoon
    app.kubernetes.io/component: mock-server
    app.kubernetes.io/part-of: nightly-export-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mockoon
  template:
    metadata:
      labels:
        app: mockoon
        app.kubernetes.io/component: mock-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mockoon
          image: mockoon/cli:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--data"
            - "/config/environment.json"
          ports:
            - name: mock
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: mockoon-config
              mountPath: /config
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: mock
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: mock
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: mockoon-config
          configMap:
            name: mockoon-env
      restartPolicy: Always
---
# ─────────────────────────────────────────────────────────────────────────────
# 3. Service
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: mockoon
  namespace: default
  labels:
    app: mockoon
    app.kubernetes.io/component: mock-server
    app.kubernetes.io/part-of: nightly-export-example
spec:
  selector:
    app: mockoon
  ports:
    - name: mock
      port: 3000
      targetPort: mock
      protocol: TCP
  type: ClusterIP
