# Secrets for the nightly-export example.
# In this demo, the Slack webhook URL points to the in-cluster Mockoon mock
# server, which accepts any POST and returns "ok".  In production, replace
# the url value with a real Slack incoming webhook URL.
#
# The slack-webhook integration (integration.yaml) reads the URL from this
# Secret via spec.http.auth.secretUrl.urlSecretRef.
apiVersion: v1
kind: Secret
metadata:
  name: slack-webhook-secret
  namespace: default
  labels:
    app.kubernetes.io/part-of: kubezap-nightly-export-example
type: Opaque
stringData:
  url: "http://mockoon.default.svc.cluster.local:3000/slack-webhook"
