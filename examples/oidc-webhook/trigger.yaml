apiVersion: automation.kubezap.io/v1alpha1
kind: Trigger
metadata:
  name: oidc-secured-hook
  namespace: default
spec:
  type: webhook
  enabled: true
  webhook:
    path: /hooks/oidc-secured
    auth:
      type: oidc
      oidc:
        issuer: "http://dex.default.svc.cluster.local:5556/dex"
        # NOTE: audience is a single string in v1alpha1 (not a list).
        # requiredClaims and jwksRefreshInterval are planned for a future release.
        audience: "kubezap-demo"
  flowRef:
    name: handle-authenticated
