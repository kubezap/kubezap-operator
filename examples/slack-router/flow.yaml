apiVersion: automation.kubezap.io/v1alpha1
kind: Flow
metadata:
  name: slack-router
  namespace: default
spec:
  description: "Route Slack slash command /kubezap to branch A, branch B, or fallback based on command text"
  timeout: 15s
  steps:
    # ── Step 1 ─────────────────────────────────────────────────────────────────
    # Slack sends application/x-www-form-urlencoded; the gateway decodes it and
    # makes the fields available as trigger.body.* just like JSON.
    # Key fields: command ("/kubezap"), text ("deploy staging"), user_name, response_url
    - name: parse-command
      description: "Extract command text, user, and response URL from the Slack payload"
      action:
        type: transform
        transform:
          mappings:
            commandText:  "$(trigger.body.text)"
            userName:     "$(trigger.body.user_name)"
            responseUrl:  "$(trigger.body.response_url)"
            channelId:    "$(trigger.body.channel_id)"

    # ── Step 2 — Branch A ──────────────────────────────────────────────────────
    # Fires when the user typed "/kubezap deploy <env>"
    # Posts the deploy event to the deploy-sink Mockoon stub (stand-in for a real deploy API).
    - name: handle-deploy
      description: "Handle '/kubezap deploy' command — route to deploy pipeline mock"
      runAfter:
        - parse-command
      when:
        - expression: 'steps.parse_command.results.commandText.startsWith("deploy")'
      action:
        type: http
        http:
          url: "http://mockoon.default.svc.cluster.local:3000/deploy-sink"
          method: POST
          headers:
            Content-Type: application/json
          body: >-
            {"action":"deploy",
             "env":"$(steps.parse_command.results.commandText)",
             "requestedBy":"$(steps.parse_command.results.userName)"}
          timeoutSeconds: 10

    # ── Step 3 — Branch B ──────────────────────────────────────────────────────
    # Fires when the user typed "/kubezap status <env>"
    # Posts the status query to the status-sink Mockoon stub.
    - name: handle-status
      description: "Handle '/kubezap status' command — route to status-query mock"
      runAfter:
        - parse-command
      when:
        - expression: 'steps.parse_command.results.commandText.startsWith("status")'
      action:
        type: http
        http:
          url: "http://mockoon.default.svc.cluster.local:3000/status-sink"
          method: POST
          headers:
            Content-Type: application/json
          body: >-
            {"action":"status",
             "query":"$(steps.parse_command.results.commandText)",
             "requestedBy":"$(steps.parse_command.results.userName)"}
          timeoutSeconds: 10

    # ── Step 4 — Fallback ──────────────────────────────────────────────────────
    # Fires when the command is anything other than "deploy" or "status".
    # Posts to the fallback-sink Mockoon stub so unknown commands are captured.
    - name: handle-unknown
      description: "Catch-all for unrecognised commands — route to fallback sink"
      runAfter:
        - parse-command
      when:
        - expression: >-
            !steps.parse_command.results.commandText.startsWith("deploy") &&
            !steps.parse_command.results.commandText.startsWith("status")
      action:
        type: http
        http:
          url: "http://mockoon.default.svc.cluster.local:3000/fallback-sink"
          method: POST
          headers:
            Content-Type: application/json
          body: >-
            {"action":"unknown",
             "command":"$(steps.parse_command.results.commandText)",
             "requestedBy":"$(steps.parse_command.results.userName)"}
          timeoutSeconds: 10
