# Placeholder Secret manifest — replace value before applying.
#
# Recommended: create via kubectl rather than applying this file directly,
# to avoid committing credentials to source control:
#
#   kubectl create secret generic slack-signing-secret \
#     --from-literal=signingSecret='<your-slack-signing-secret>'
#
# Find the signing secret in your Slack app dashboard:
#   api.slack.com/apps → <Your App> → Basic Information → App Credentials → Signing Secret
---
apiVersion: v1
kind: Secret
metadata:
  name: slack-signing-secret
  namespace: default
type: Opaque
stringData:
  signingSecret: "REPLACE-WITH-YOUR-SLACK-SIGNING-SECRET"
