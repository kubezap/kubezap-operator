apiVersion: automation.kubezap.io/v1alpha1
kind: Trigger
metadata:
  name: slack-slash-command
  namespace: default
spec:
  type: webhook
  enabled: true
  webhook:
    path: /hooks/slack-slash
    method: POST
    auth:
      type: hmac
      hmac:
        # Slack signs requests using HMAC-SHA256 over "v0:<timestamp>:<raw-body>".
        # The gateway matches the X-Slack-Signature header (format "v0=<hex>").
        secretRef:
          name: slack-signing-secret
          key: signingSecret
        header: "X-Slack-Signature"
        algorithm: sha256
        prefix: "v0="
      ipAllowlist:
        # Slack publishes its outbound IP ranges at:
        # https://api.slack.com/apis/ip-ranges
        # Update this list when Slack publishes new ranges.
        cidrs:
          - "34.195.115.34/32"
          - "34.201.82.123/32"
          - "54.80.233.203/32"
          - "52.73.35.64/32"
          - "3.213.196.90/32"
          - "18.234.186.59/32"
          # Add additional Slack IPs from the published list as needed.
  flowRef:
    name: slack-router
