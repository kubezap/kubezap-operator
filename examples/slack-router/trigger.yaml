apiVersion: automation.kubezap.io/v1alpha1
kind: Trigger
metadata:
  name: slack-slash-command
  namespace: default
spec:
  type: webhook
  enabled: true
  webhook:
    path: /hooks/slack-slash
    method: POST
    auth:
      type: hmac
      hmac:
        # NOTE: Per-trigger HMAC header/algorithm/prefix configuration is planned
        # but not yet implemented. The gateway currently uses GitHub-style HMAC:
        # header X-Hub-Signature-256, format "sha256=<hex>", body-only (no timestamp).
        # For real Slack integration, the gateway needs to verify "v0=<hex>" over
        # "v0:<timestamp>:<raw-body>" using X-Slack-Signature — tracked as a
        # future enhancement. For now, HMAC auth is verified using GitHub format.
        # In production with real Slack: add an ingress-level or load-balancer
        # IP allowlist for Slack's published IP ranges as defence-in-depth.
        secretRef:
          name: slack-signing-secret
          key: signingSecret
  flowRef:
    name: slack-router
