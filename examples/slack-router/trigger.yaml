apiVersion: automation.kubezap.io/v1alpha1
kind: Trigger
metadata:
  name: slack-slash-command
  namespace: default
spec:
  type: webhook
  enabled: true
  webhook:
    path: /hooks/slack-slash
    method: POST
    auth:
      type: hmac
      hmac:
        # provider: slack verifies X-Slack-Signature ("v0=<hex>") over
        # "v0:<timestamp>:<raw-body>" using X-Slack-Request-Timestamp, and
        # rejects requests whose timestamp has drifted beyond
        # timestampToleranceSeconds (replay protection).
        provider: slack
        timestampToleranceSeconds: 300
        secretRef:
          name: slack-signing-secret
          key: signingSecret
    # NOTE: spec.webhook.auth.type is a single enum value, so HMAC and IP
    # allowlist can't be combined here. In production with real Slack, add an
    # ingress-level or load-balancer IP allowlist for Slack's published IP
    # ranges (api.slack.com/apis/ip-ranges) as defence-in-depth.
  flowRef:
    name: slack-router
