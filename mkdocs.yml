site_name: KubeZap Documentation
site_description: Declarative Kubernetes workflow automation — CRDs, guides, and API reference.
site_url: https://kubezap.github.io/kubezap-operator/
repo_url: https://github.com/kubezap/kubezap-operator
repo_name: kubezap/kubezap-operator
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# docs/design/ holds internal technical decision records (see docs/design/README.md) —
# not curated user-facing documentation, so it is excluded from the published site.
# `exclude_docs` removes matched files from the build entirely (not just from nav),
# so no design/*.html pages are generated or reachable on the published site.
exclude_docs: |
  design/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

# No explicit `nav:` — mkdocs auto-generates navigation from docs/'s existing
# directory structure (docs/, docs/api/, docs/guides/, docs/dev/, docs/architecture/).
# This matches the "least new configuration" goal: the existing doc layout already
# organizes content sensibly, and hand-maintaining a nav list would be one more
# thing to keep in sync as docs/ evolves.
